name = "muster-roll"
compatibility_date = "2026-11-09"

[build]
command = "bun run build"

[assets]
directory = "./dist"
# The default handling redirects /index.html to /, and the public/_headers rules name the .html paths.
html_handling = "none"

[[routes]]
pattern = "musterroll.2249364.xyz"
custom_domain = true
