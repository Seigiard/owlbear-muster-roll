name = "muster-roll"
compatibility_date = "2026-11-09"

# The Worker has no workers.dev route, so Version URLs and Preview URLs start disabled. This turns
# them on: each Preview and each uploaded version gets its own `*.workers.dev` address. Production
# traffic stays on the custom domain below.
preview_urls = true

[build]
command = "bun run build"

[assets]
directory = "./dist"
# The default handling redirects /index.html to /, and the public/_headers rules name the .html paths.
html_handling = "none"

[[routes]]
pattern = "musterroll.2249364.xyz"
custom_domain = true

# Workers Builds deploys every branch other than master with `wrangler preview`, which needs this
# block even when a Preview shares all of production's settings. Assets, compatibility and the
# build command stay at the top level; the custom domain applies to production only.
[previews]
