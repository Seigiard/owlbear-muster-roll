<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор: клик в превью</title>
<style>
  :root {
    --bg: #1b1f2c;
    --paper: #222639;
    --field: #2c3149;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #bb99ff;
    --accent-soft: rgba(187, 153, 255, 0.16);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --good: #7fd6a4;
    --radius: 6px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #dde1ee;
      --paper: #f1f3f9;
      --field: #ffffff;
      --line: rgba(0, 0, 0, 0.12);
      --accent: #7a45f0;
      --accent-soft: rgba(122, 69, 240, 0.12);
      --text: rgba(0, 0, 0, 0.87);
      --muted: rgba(0, 0, 0, 0.58);
      --good: #1d7a47;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }

  /* Top bar */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper);
  }
  .bar h1 { font-size: 15px; font-weight: 650; margin: 0 12px 0 0; }
  .bar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: transparent; border-radius: var(--radius);
    padding: 5px 10px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #14101f; font-weight: 600; }
  .ok { color: var(--good); font-size: 13px; }

  /* Layout */
  .layout { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: calc(100dvh - 52px); }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  .panel-title { font-size: 12px; color: var(--muted); padding: 12px 16px 6px; margin: 0; font-weight: 600; }
  .tree { list-style: none; margin: 0; padding: 0 8px 12px; overflow: auto; max-height: 46vh; }
  .tree li button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tree li button:hover { background: var(--accent-soft); }
  .tree li button[aria-current="true"] { background: var(--accent); color: #14101f; }
  .tree .kind { color: var(--muted); }
  .tree li button[aria-current="true"] .kind { color: #14101f; opacity: 0.7; }
  .form { border-top: 1px solid var(--line); padding: 4px 16px 16px; }
  .form label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .form input, .form select {
    width: 100%; padding: 6px 8px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--field);
  }
  .form .group { margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .form .group h3 { font-size: 13px; margin: 0; }
  .form .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* Preview */
  .right { min-width: 0; padding: 12px 16px 24px; position: relative; }
  .preview-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
  .preview-head .panel-title { padding: 0; }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .segmented button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: #14101f; font-weight: 600; }
  .window {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    max-width: 640px; padding: 12px;
  }
  .sheet-name { font-size: 18px; font-weight: 650; margin: 0 0 10px; }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; container-type: inline-size; }
  .section { grid-column: span 2; border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
  .section.half { grid-column: span 1; }
  @container (max-width: 480px) { .section.half { grid-column: span 2; } }
  .section h2 { font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 0 6px; }
  .grid { display: grid; gap: 4px 6px; align-items: center; }
  .block { padding: 4px 0; border-top: 1px dashed var(--line); }
  .block:first-of-type { border-top: 0; }
  .cell { position: relative; min-width: 0; border-radius: 4px; }
  .cell.text { color: var(--muted); font-size: 13px; }
  .cell input[type="text"], .cell input[type="number"] {
    width: 100%; min-width: 0; padding: 4px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--field);
  }
  .cell input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .dice {
    border: 1px solid var(--line); background: transparent; border-radius: 4px;
    padding: 3px 6px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .add { margin-top: 6px; }
  .cell.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  .section.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 150ms ease-out;
  }
  .toast.on { opacity: 1; }
  .tag { display: none; }

  /* 1. Режимы: в «Структуре» поля только показывают, клик выбирает. */
  [data-design="modes"][data-mode="structure"] .preview .cell { cursor: pointer; }
  [data-design="modes"][data-mode="structure"] .preview .cell:hover { outline: 1px dashed var(--accent); }
  [data-design="modes"][data-mode="structure"] .preview input,
  [data-design="modes"][data-mode="structure"] .preview .dice,
  [data-design="modes"][data-mode="structure"] .preview .add { pointer-events: none; }
  [data-design="modes"][data-mode="structure"] .preview .cell input { opacity: 0.75; }
  [data-design="modes"][data-mode="data"] .preview .cell.selected { outline-style: dotted; outline-width: 1px; }

  /* 2. Рамка и поле: у ячейки есть поле вокруг ввода, рамка выбирает. */
  [data-design="frame"] .preview .grid { gap: 2px; }
  [data-design="frame"] .preview .cell { padding: 5px; cursor: pointer; }
  [data-design="frame"] .preview .cell:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  [data-design="frame"] .preview .cell input { cursor: text; }
  [data-design="frame"] .preview .cell input[type="checkbox"] { cursor: pointer; }

  /* 3. Двойной клик: первый выбирает, второй открывает ввод. */
  [data-design="dbl"] .preview .cell { cursor: default; }
  [data-design="dbl"] .preview .cell:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  [data-design="dbl"] .preview .cell input { cursor: default; caret-color: transparent; }
  [data-design="dbl"] .preview .cell.editing input { cursor: text; caret-color: auto; box-shadow: 0 0 0 2px var(--accent); }
  [data-design="dbl"] .preview .cell.selected:not(.editing) input { cursor: text; }

  /* 4. Ручка: ввод везде, ярлык при наведении выбирает узел. */
  [data-design="handle"] .preview .cell { padding-top: 2px; }
  [data-design="handle"] .preview .cell .tag {
    position: absolute; top: -9px; left: 2px; z-index: 2;
    font: 600 10px/1 ui-monospace, Menlo, monospace; padding: 3px 5px; border-radius: 3px;
    background: var(--accent); color: #14101f; border: 0; cursor: pointer;
  }
  [data-design="handle"] .preview .cell:hover .tag,
  [data-design="handle"] .preview .cell.selected .tag,
  [data-design="handle"] .preview .cell:focus-within .tag { display: block; }

  /* 5. Данные в дереве: превью только выбирает, значения пишутся слева. */
  [data-design="tree"] .preview .cell { cursor: pointer; }
  [data-design="tree"] .preview .cell:hover { outline: 1px dashed var(--accent); }
  [data-design="tree"] .preview input,
  [data-design="tree"] .preview .dice,
  [data-design="tree"] .preview .add { pointer-events: none; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); }
    .tree { max-height: 30vh; }
    .window { padding: 8px; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Конструктор пресетов</h1>
  <button class="btn" type="button">Открыть…</button>
  <button class="btn" type="button" aria-label="Отменить правку">↶</button>
  <button class="btn" type="button" aria-label="Повторить правку">↷</button>
  <span class="ok">Проблем нет</span>
  <span class="spacer"></span>
  <button class="btn" type="button">Скачать снимок</button>
  <button class="btn primary" type="button">Скачать пресет</button>
</header>

<div class="layout">
  <section class="left" aria-labelledby="structure-title">
    <h2 class="panel-title" id="structure-title">Структура</h2>
    <ul class="tree" id="tree"></ul>
    <div class="form" id="form"></div>
  </section>

  <section class="right">
    <div class="preview-head">
      <h2 class="panel-title">Превью · окно 600 × 600</h2>
      <div class="segmented" role="group" aria-label="Что делает клик в превью" data-for-design="modes">
        <button type="button" data-set-mode="structure" aria-pressed="true">Структура</button>
        <button type="button" data-set-mode="data" aria-pressed="false">Данные</button>
      </div>
    </div>
    <div class="window">
      <p class="sheet-name" id="sheet-name"></p>
      <div class="sections preview" id="preview"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="grill-round">
{
  "question": "Что делает клик по ячейке превью, когда в нём можно и выбирать узел, и вписывать значение?",
  "designs": [
    { "id": "modes", "name": "режимы", "angle": "переключатель «Структура / Данные» над превью решает, что значит клик", "cost": "лишний клик на каждое переключение и вечный вопрос «в каком я режиме»" },
    { "id": "frame", "name": "рамка и поле", "angle": "клик по рамке или подписи выбирает узел, клик в поле вписывает значение", "cost": "у ячейки появляется отступ-рамка, и в узком окне в неё легко промахнуться" },
    { "id": "dbl", "name": "двойной клик", "angle": "первый клик выбирает узел, второй клик или Enter открывает ввод, Esc выходит", "cost": "вписать значение всегда стоит два клика" },
    { "id": "handle", "name": "ярлык", "angle": "превью — это живой лист; узел выбирается только ярлыком с id, который появляется при наведении", "cost": "выбор узла спрятан, на телефоне наведения нет" },
    { "id": "tree", "name": "данные слева", "angle": "превью только выбирает, значение вписывается в форме узла слева", "cost": "данные вводятся вдали от листа, повторы набивать тяжело" }
  ],
  "states": [
    { "id": "full", "name": "лист заполнен" },
    { "id": "empty", "name": "лист пустой" }
  ]
}
</script>
<script>
// grill-design picker: a draggable dock that switches the designs of one round.
//
// Inline this file into the round's HTML, after the round's JSON block: a
// script element of type application/json with id grill-round, holding
// { question, designs: [{ id, name, angle, cost }], states: [{ id, name }] }.
// This file never spells out a closing script tag, because the HTML parser
// would end the inline script at it.
//
// The live choice is written to data-design and data-state on the html
// element, so each design styles itself under [data-design="<id>"]. Elements marked
// data-for-design="<id> <id>" or data-for-state="<id>" are hidden unless the
// live choice is listed. Every switch dispatches a "grill:change" event on
// document with { design, state, replay } in detail.
//
// Ideas borrowed from the variate card (github.com/Nutlope/variate, MIT).

(() => {
  "use strict";

  const source = document.getElementById("grill-round");
  if (!source) {
    console.error("grill-design picker: no application/json script with id grill-round");
    return;
  }
  let round;
  try {
    round = JSON.parse(source.textContent);
  } catch (error) {
    console.error("grill-design picker: grill-round is not valid JSON", error);
    return;
  }
  const designs = Array.isArray(round.designs) ? round.designs : [];
  const states = Array.isArray(round.states) ? round.states : [];
  if (!designs.length) {
    console.error("grill-design picker: grill-round has no designs");
    return;
  }

  const root = document.documentElement;
  const POSITION_KEY = "grill-design:dock-position";

  // localStorage throws in private windows and sandboxed previews; the dock
  // must still work there, it only forgets where it was dragged.
  const storage = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} },
  };

  const fromHash = () => {
    const params = new URLSearchParams(location.hash.slice(1));
    return { design: params.get("design"), state: params.get("state") };
  };
  const known = (list, id) => list.some((item) => item.id === id);

  const initial = fromHash();
  let design = known(designs, initial.design) ? initial.design : designs[0].id;
  let state = states.length ? (known(states, initial.state) ? initial.state : states[0].id) : null;

  function applyChoice(replay) {
    root.dataset.design = design;
    if (state) root.dataset.state = state; else delete root.dataset.state;
    for (const node of document.querySelectorAll("[data-for-design]")) {
      node.hidden = !node.dataset.forDesign.split(/\s+/).includes(design);
    }
    for (const node of document.querySelectorAll("[data-for-state]")) {
      node.hidden = !node.dataset.forState.split(/\s+/).includes(state);
    }
    const hash = new URLSearchParams({ design, ...(state ? { state } : {}) });
    history.replaceState(null, "", `#${hash}`);
    document.dispatchEvent(new CustomEvent("grill:change", { detail: { design, state, replay } }));
    render();
  }

  // Re-entering the same design restarts its CSS animations, so a round about
  // motion can be watched more than once.
  function replay() {
    delete root.dataset.design;
    void root.offsetWidth;
    applyChoice(true);
  }

  function selectDesign(id) {
    if (id === design) { replay(); return; }
    design = id;
    applyChoice(false);
  }

  function step(delta) {
    const index = designs.findIndex((item) => item.id === design);
    selectDesign(designs[(index + delta + designs.length) % designs.length].id);
  }

  // The dock lives in a shadow root reset with all: initial, so the designs
  // under review cannot restyle it and it cannot leak into them.
  const host = document.createElement("grill-picker");
  const shadow = host.attachShadow({ mode: "open" });
  shadow.innerHTML = `
<style>
:host { all: initial; display: block; position: fixed; right: 16px; bottom: 16px; z-index: 2147483646; }
@media print { :host { display: none } }
* { box-sizing: border-box; margin: 0; }
.dock {
  width: min(320px, calc(100vw - 32px));
  padding: 10px 12px 12px;
  border-radius: 12px;
  background: #16181d;
  color: #e8e9ed;
  box-shadow: 0 8px 28px rgb(0 0 0 / .35), 0 0 0 1px rgb(255 255 255 / .08);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
.grip {
  display: flex; align-items: center; gap: 8px;
  cursor: grab; touch-action: none; user-select: none;
  color: #9a9ea8; font-size: 12px;
}
.grip:active { cursor: grabbing; }
.grip::before { content: "⋮⋮"; letter-spacing: -2px; }
.question { color: #e8e9ed; font-weight: 600; }
.pager { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
button {
  all: unset; box-sizing: border-box;
  min-width: 28px; height: 28px; padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 7px; background: #23262d; color: #c9ccd3;
  font: inherit; cursor: pointer; white-space: nowrap;
}
button:hover { background: #2d3139; }
button:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 1px; }
button[aria-pressed="true"] { background: #e8e9ed; color: #16181d; font-weight: 600; }
.detail { margin-top: 8px; color: #b4b8c1; }
.detail b { color: #e8e9ed; font-weight: 600; }
.cost { color: #f0b37e; }
.states { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2d3139; }
.keys { margin-top: 8px; color: #6f7480; font-size: 11px; }
</style>
<div class="dock" role="region" aria-label="Design picker">
  <div class="grip"><span class="question"></span></div>
  <div class="pager" role="group" aria-label="Designs"></div>
  <p class="detail" aria-live="polite"></p>
  <div class="states" role="group" aria-label="States"></div>
  <p class="keys">← → or 1–9 switch · click the current design to replay it</p>
</div>`;

  const dock = shadow.querySelector(".dock");
  const grip = shadow.querySelector(".grip");
  const pager = shadow.querySelector(".pager");
  const detail = shadow.querySelector(".detail");
  const stateBar = shadow.querySelector(".states");
  shadow.querySelector(".question").textContent = round.question || "Pick a design";
  if (!states.length) stateBar.remove();

  const designButtons = designs.map((item, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.addEventListener("click", () => selectDesign(item.id));
    button.dataset.number = String(index + 1);
    pager.append(button);
    return button;
  });
  const stateButtons = states.map((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.name || item.id;
    button.addEventListener("click", () => { state = item.id; applyChoice(false); });
    stateBar.append(button);
    return button;
  });

  function render() {
    designs.forEach((item, index) => {
      const live = item.id === design;
      const button = designButtons[index];
      // The live chip wears its name and the rest stay numbers, so the dock
      // stays narrow while always saying what is on screen.
      button.textContent = live ? `${index + 1} · ${item.name || item.id}` : String(index + 1);
      button.setAttribute("aria-pressed", String(live));
      button.title = [item.name, item.angle, item.cost && `cost: ${item.cost}`].filter(Boolean).join(" — ");
    });
    stateButtons.forEach((button, index) => {
      button.setAttribute("aria-pressed", String(states[index].id === state));
    });
    const current = designs.find((item) => item.id === design);
    detail.replaceChildren();
    if (current.angle) {
      const angle = document.createElement("b");
      angle.textContent = current.angle;
      detail.append(angle);
    }
    if (current.cost) {
      const cost = document.createElement("span");
      cost.className = "cost";
      cost.textContent = `${current.angle ? " · " : ""}cost: ${current.cost}`;
      detail.append(cost);
    }
    detail.hidden = !current.angle && !current.cost;
  }

  function onKey(event) {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
    const target = event.composedPath()[0];
    if (target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
    if (event.key === "ArrowRight") { step(1); event.preventDefault(); return; }
    if (event.key === "ArrowLeft") { step(-1); event.preventDefault(); return; }
    const number = Number(event.key);
    if (Number.isInteger(number) && number >= 1 && number <= designs.length) {
      selectDesign(designs[number - 1].id);
      event.preventDefault();
    }
  }

  function place(position) {
    if (!position) return;
    const maxX = Math.max(0, innerWidth - dock.offsetWidth);
    const maxY = Math.max(0, innerHeight - dock.offsetHeight);
    host.style.left = `${Math.min(Math.max(0, position.x), maxX)}px`;
    host.style.top = `${Math.min(Math.max(0, position.y), maxY)}px`;
    host.style.right = "auto";
    host.style.bottom = "auto";
  }

  grip.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const box = host.getBoundingClientRect();
    const offsetX = event.clientX - box.left;
    const offsetY = event.clientY - box.top;
    grip.setPointerCapture(event.pointerId);
    const move = (moveEvent) => place({ x: moveEvent.clientX - offsetX, y: moveEvent.clientY - offsetY });
    const end = () => {
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", end);
      grip.removeEventListener("pointercancel", end);
      const placed = host.getBoundingClientRect();
      storage.set(POSITION_KEY, { x: placed.left, y: placed.top });
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", end);
    grip.addEventListener("pointercancel", end);
  });

  addEventListener("keydown", onKey);
  addEventListener("hashchange", () => {
    const next = fromHash();
    if (known(designs, next.design)) design = next.design;
    if (known(states, next.state)) state = next.state;
    applyChoice(false);
  });
  addEventListener("resize", () => { if (host.style.left) place({ x: parseFloat(host.style.left), y: parseFloat(host.style.top) }); });

  document.body.append(host);
  place(storage.get(POSITION_KEY));
  applyChoice(false);
})();

</script>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  let uidSeq = 0;
  const T = (text) => ({ uid: "t" + uidSeq++, kind: "text", text });
  const F = (id, type, name) => ({ uid: "f-" + id, kind: "field", id, type, name: name || "" });
  const D = (formula) => ({ uid: "d" + uidSeq++, kind: "dice", formula });

  const SECTIONS = [
    { uid: "s-char", title: "Персонаж", cols: 4, rows: [
      [T("Имя"), F("name", "text"), T("Предыстория"), F("background", "text")],
      [T("Возраст"), F("age", "number"), T("Монеты, зм"), F("gold", "number")],
    ] },
    { uid: "s-attr", title: "Характеристики", cols: 4, half: true, rows: [
      [T(""), T("Тек."), T("Макс."), T("Спасбросок")],
      [T("STR"), F("str", "number"), F("str_max", "number", "STR, максимум"), D("1d20 <= str")],
      [T("DEX"), F("dex", "number"), F("dex_max", "number", "DEX, максимум"), D("1d20 <= dex")],
      [T("WIL"), F("wil", "number"), F("wil_max", "number", "WIL, максимум"), D("1d20 <= wil")],
    ] },
    { uid: "s-def", title: "Защита", cols: 4, half: true, rows: [
      [T("HP"), F("hp", "number"), T("из"), F("hp_max", "number", "HP, максимум")],
      [T("Броня"), F("armor", "number")],
      [T("Лишения"), F("deprived", "check")],
    ] },
    { uid: "s-weap", title: "Оружие", cols: 4, repeat: true, rows: [
      [T("Название"), F("weapon", "text"), T("Урон"), F("damage", "text")],
    ] },
  ];

  const TYPE_NAME = { text: "текст", number: "число", check: "флажок" };
  const FULL = {
    name: "Ирма Солодовник", background: "Травница", age: 23, gold: 14,
    str: 11, str_max: 12, dex: 14, dex_max: 14, wil: 9, wil_max: 10,
    hp: 3, hp_max: 4, armor: 1, deprived: false,
    blocks: [{ weapon: "Кинжал", damage: "d6" }, { weapon: "Праща", damage: "d4" }],
  };

  let values = {};
  let selected = "f-hp";
  let editing = null;
  let mode = "structure";

  const byUid = new Map();
  const parentOf = new Map();
  for (const section of SECTIONS) {
    byUid.set(section.uid, { node: section, type: "section" });
    section.rows.forEach((row, index) => {
      const rowUid = section.uid + "-r" + index;
      byUid.set(rowUid, { node: row, type: "row", index, section });
      parentOf.set(rowUid, section.uid);
      for (const cell of row) {
        byUid.set(cell.uid, { node: cell, type: cell.kind, section, rowUid });
        parentOf.set(cell.uid, rowUid);
      }
    });
  }

  const design = () => root.dataset.design;
  const isRepeatField = (uid) => byUid.get(uid)?.section?.repeat === true;

  function resetValues() {
    const full = root.dataset.state !== "empty";
    values = full ? structuredClone(FULL) : { blocks: [] };
    editing = null;
  }

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key in node && key !== "list") node[key] = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child !== null && child !== undefined) node.append(child.nodeType ? child : String(child));
    }
    return node;
  }

  function select(uid) {
    selected = uid;
    if (editing !== uid) editing = null;
    render();
  }

  let toastTimer = 0;
  function roll(formula) {
    const stat = formula.split("<=")[1]?.trim();
    const target = Number(values[stat]);
    const die = 1 + Math.floor(Math.random() * 20);
    const verdict = Number.isFinite(target) && values[stat] !== undefined && values[stat] !== ""
      ? (die <= target ? "успех" : "провал")
      : "нет значения " + stat;
    const toast = document.getElementById("toast");
    toast.textContent = formula.replace("<=", "≤") + " → " + die + " · " + verdict;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("on"), 2200);
  }

  function readValue(cell, block) {
    const source = block === undefined ? values : values.blocks[block];
    return source?.[cell.id];
  }
  function writeValue(cell, block, value) {
    if (block === undefined) values[cell.id] = value;
    else values.blocks[block][cell.id] = value;
  }

  // One click handler per cell; what the click means is the design.
  function onCellClick(event, cell, block) {
    const target = event.target;
    const onControl = target.closest("input, .dice");
    const d = design();
    if (d === "modes") {
      if (mode === "structure") select(cell.uid);
      else if (target.closest(".dice")) roll(cell.formula);
      return;
    }
    if (d === "frame") {
      if (target.closest(".dice")) { roll(cell.formula); return; }
      if (!onControl) select(cell.uid);
      return;
    }
    if (d === "dbl") {
      if (selected === cell.uid) {
        if (cell.kind === "dice") roll(cell.formula);
        else if (cell.kind === "field" && cell.type === "check") { writeValue(cell, block, readValue(cell, block) !== true); render(); }
        else if (cell.kind === "field") startEditing(cell.uid, block);
      } else {
        event.preventDefault();
        select(cell.uid);
      }
      return;
    }
    if (d === "handle") {
      if (target.closest(".tag")) { select(cell.uid); return; }
      if (target.closest(".dice")) roll(cell.formula);
      return;
    }
    if (d === "tree") select(cell.uid);
  }

  function startEditing(uid, block) {
    editing = uid;
    render();
    const selector = '.cell[data-uid="' + uid + '"]' + (block === undefined ? "" : '[data-block="' + block + '"]');
    const input = document.querySelector(selector + " input");
    if (input) { input.focus(); input.select?.(); }
  }

  function renderCell(cell, block) {
    const classes = ["cell", cell.kind];
    if (cell.uid === selected) classes.push("selected");
    if (cell.uid === editing) classes.push("editing");
    const wrap = el("div", {
      class: classes.join(" "), "data-uid": cell.uid,
      "data-block": block === undefined ? null : String(block),
    });
    const tagText = cell.kind === "field" ? cell.id : cell.kind === "dice" ? "кубик" : "подпись";
    wrap.append(el("button", { class: "tag", type: "button", tabIndex: -1 }, tagText));

    if (cell.kind === "text") wrap.append(cell.text || " ");
    if (cell.kind === "dice") wrap.append(el("button", { class: "dice", type: "button", title: cell.formula.replace("<=", "≤") }, "🎲 " + cell.formula.split(" ")[0]));
    if (cell.kind === "field") {
      const current = readValue(cell, block);
      const d = design();
      const locked = d === "dbl" && (editing !== cell.uid || cell.type === "check");
      if (cell.type === "check") {
        const box = el("input", { type: "checkbox", checked: current === true, "aria-label": cell.name || cell.id });
        box.addEventListener("click", (event) => {
          if (locked) { event.preventDefault(); return; }
          writeValue(cell, block, box.checked);
        });
        wrap.append(box);
      } else {
        const input = el("input", {
          type: cell.type, value: current ?? "", readOnly: locked || d === "tree",
          "aria-label": cell.name || cell.id,
        });
        input.addEventListener("mousedown", (event) => { if (locked) event.preventDefault(); });
        input.addEventListener("input", () => {
          writeValue(cell, block, cell.type === "number" && input.value !== "" ? Number(input.value) : input.value);
          if (design() !== "tree") renderForm();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && design() === "dbl") { editing = null; render(); }
        });
        wrap.append(input);
      }
    }
    wrap.addEventListener("click", (event) => onCellClick(event, cell, block));
    return wrap;
  }

  function renderPreview() {
    const preview = document.getElementById("preview");
    preview.replaceChildren();
    document.getElementById("sheet-name").textContent = values.name || "Без имени";
    for (const section of SECTIONS) {
      const box = el("div", { class: "section" + (section.half ? " half" : "") + (selected === section.uid ? " selected" : "") });
      const title = el("h2", {}, section.title);
      title.addEventListener("click", () => {
        if (design() !== "handle" && !(design() === "modes" && mode === "data")) select(section.uid);
      });
      box.append(title);
      const columns = "repeat(" + section.cols + ", minmax(0, 1fr))";
      if (section.repeat) {
        values.blocks.forEach((_, block) => {
          const grid = el("div", { class: "grid block" });
          grid.style.gridTemplateColumns = columns;
          for (const row of section.rows) for (const cell of row) grid.append(renderCell(cell, block));
          box.append(grid);
        });
        const add = el("button", { class: "btn add", type: "button" }, "Добавить");
        add.addEventListener("click", () => { values.blocks.push({ weapon: "", damage: "" }); render(); });
        box.append(add);
      } else {
        const grid = el("div", { class: "grid" });
        grid.style.gridTemplateColumns = columns;
        for (const row of section.rows) for (const cell of row) grid.append(renderCell(cell));
        box.append(grid);
      }
      preview.append(box);
    }
  }

  function treeLabel(uid) {
    const entry = byUid.get(uid);
    if (entry.type === "set") return ["Персонажи", "набор"];
    if (entry.type === "tab") return ["Вкладка", ""];
    if (entry.type === "section") return [entry.node.title, entry.node.repeat ? "секция · повтор" : "секция"];
    if (entry.type === "row") return ["Строка " + (entry.index + 1), ""];
    if (entry.type === "text") return ["«" + (entry.node.text || "…") + "»", "подпись"];
    if (entry.type === "dice") return [entry.node.formula, "кубик"];
    return [entry.node.id, TYPE_NAME[entry.node.type]];
  }

  function renderTree() {
    const tree = document.getElementById("tree");
    tree.replaceChildren();
    const path = new Set();
    for (let uid = selected; uid; uid = parentOf.get(uid)) path.add(uid);
    const item = (uid, depth) => {
      const [name, kind] = treeLabel(uid);
      const button = el("button", { type: "button", "aria-current": uid === selected ? "true" : "false" },
        name, kind ? el("span", { class: "kind" }, " · " + kind) : null);
      button.style.paddingLeft = 8 + depth * 14 + "px";
      button.addEventListener("click", () => select(uid));
      tree.append(el("li", {}, button));
    };
    item("set", 0);
    item("tab", 1);
    for (const section of SECTIONS) {
      item(section.uid, 2);
      if (!path.has(section.uid)) continue;
      section.rows.forEach((row, index) => {
        const rowUid = section.uid + "-r" + index;
        item(rowUid, 3);
        if (path.has(rowUid)) for (const cell of row) item(cell.uid, 4);
      });
    }
  }
  byUid.set("set", { node: {}, type: "set" });
  byUid.set("tab", { node: {}, type: "tab" });

  function field(label, input) { return [el("label", {}, label), input]; }

  function renderForm() {
    const form = document.getElementById("form");
    form.replaceChildren();
    const entry = byUid.get(selected);
    const [name, kind] = treeLabel(selected);
    form.append(el("h2", { class: "panel-title", style: "padding:12px 0 0" }, name + (kind ? " · " + kind : "")));
    if (entry.type === "section") {
      form.append(...field("Заголовок", el("input", { value: entry.node.title })));
      form.append(...field("Колонки", el("input", { type: "number", value: entry.node.cols })));
      form.append(...field("Ширина", el("select", {}, el("option", {}, entry.node.half ? "1/2" : "Вся"))));
    } else if (entry.type === "text") {
      const input = el("input", { value: entry.node.text });
      input.addEventListener("input", () => { entry.node.text = input.value; renderPreview(); renderTree(); });
      form.append(...field("Подпись", input));
    } else if (entry.type === "dice") {
      form.append(...field("Формула", el("input", { value: entry.node.formula })));
    } else if (entry.type === "field") {
      form.append(...field("Id", el("input", { value: entry.node.id })));
      form.append(...field("Тип", el("select", {}, el("option", {}, TYPE_NAME[entry.node.type]))));
      form.append(...field("Имя", el("input", { value: entry.node.name, placeholder: "Как в истории бросков" })));
      form.append(...field("Видят", el("select", {}, el("option", {}, "Все"), el("option", {}, "Только мастер"))));
      if (design() === "tree") form.append(dataGroup(entry.node));
    } else {
      form.append(el("p", { class: "hint" }, "Выберите ячейку в превью или узел в дереве."));
    }
  }

  // Design 5: the field's values live in the form, one input per repeat block.
  function dataGroup(cell) {
    const group = el("div", { class: "group" }, el("h3", {}, "Данные в превью"));
    const blocks = isRepeatField(cell.uid) ? values.blocks.map((_, i) => i) : [undefined];
    blocks.forEach((block) => {
      const label = block === undefined ? "Значение" : "Блок " + (block + 1);
      if (cell.type === "check") {
        const box = el("input", { type: "checkbox", checked: readValue(cell, block) === true, style: "width:auto" });
        box.addEventListener("change", () => { writeValue(cell, block, box.checked); renderPreview(); });
        group.append(...field(label, box));
      } else {
        const input = el("input", { type: cell.type, value: readValue(cell, block) ?? "" });
        input.addEventListener("input", () => {
          writeValue(cell, block, cell.type === "number" && input.value !== "" ? Number(input.value) : input.value);
          renderPreview();
        });
        group.append(...field(label, input));
      }
    });
    if (isRepeatField(cell.uid)) {
      const add = el("button", { class: "btn", type: "button", style: "margin-top:10px" }, "Добавить блок");
      add.addEventListener("click", () => { values.blocks.push({ weapon: "", damage: "" }); render(); });
      group.append(add);
    }
    return group;
  }

  function render() {
    root.dataset.mode = mode;
    for (const button of document.querySelectorAll("[data-set-mode]")) {
      button.setAttribute("aria-pressed", String(button.dataset.setMode === mode));
    }
    renderTree();
    renderForm();
    renderPreview();
  }

  for (const button of document.querySelectorAll("[data-set-mode]")) {
    button.addEventListener("click", () => { mode = button.dataset.setMode; render(); });
  }
  document.addEventListener("keydown", (event) => {
    if (design() !== "dbl" || editing) return;
    if (event.key === "Enter" && byUid.get(selected)?.type === "field" && !event.target.closest("input, select, button")) {
      event.preventDefault();
      startEditing(selected, isRepeatField(selected) ? 0 : undefined);
    }
  });
  document.addEventListener("grill:change", () => { resetValues(); render(); });

  resetValues();
  render();
})();
</script>
</body>
</html>
