<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор: листы снимка</title>
<style>
  :root {
    --bg: #1b1f2c;
    --paper: #222639;
    --field: #2c3149;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #bb99ff;
    --accent-soft: rgba(187, 153, 255, 0.16);
    --on-accent: #14101f;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --good: #7fd6a4;
    --radius: 6px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #dde1ee;
      --paper: #f1f3f9;
      --field: #ffffff;
      --line: rgba(0, 0, 0, 0.12);
      --accent: #7a45f0;
      --accent-soft: rgba(122, 69, 240, 0.12);
      --on-accent: #ffffff;
      --text: rgba(0, 0, 0, 0.87);
      --muted: rgba(0, 0, 0, 0.58);
      --good: #1d7a47;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .bar h1 { font-size: 15px; font-weight: 650; margin: 0 12px 0 0; }
  .bar .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: var(--radius); padding: 5px 10px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .ok { color: var(--good); font-size: 13px; }

  .layout { display: grid; grid-template-columns: minmax(260px, 320px) 1fr; min-height: calc(100dvh - 52px); }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  .panel-title { font-size: 12px; color: var(--muted); padding: 12px 16px 6px; margin: 0; font-weight: 600; }
  .tree { list-style: none; margin: 0; padding: 0 8px 12px; overflow: auto; max-height: 48vh; }
  .tree li button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 3px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree li button:hover { background: var(--accent-soft); }
  .tree li button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
  .tree .kind { color: var(--muted); }
  .tree li button[aria-current="true"] .kind { color: inherit; opacity: 0.7; }
  .tree .root { font-size: 12px; font-weight: 650; color: var(--muted); padding: 10px 8px 4px; }
  .tree .add-sheet { color: var(--accent); }
  .form { border-top: 1px solid var(--line); padding: 4px 16px 16px; }
  .form label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .form input, .form select { width: 100%; padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--field); }
  .form .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  .right { min-width: 0; padding: 12px 16px 24px; }
  .preview-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
  .preview-head .panel-title { padding: 0; }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .segmented button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

  /* The strip of sheets above the window (design C). */
  .strip { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px; max-width: 760px; }
  .strip button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; white-space: nowrap; }
  .strip button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .strip .sample { font-style: italic; }
  .strip .plus { color: var(--accent); }
  .tpl-switch { margin-bottom: 8px; }

  .window { display: grid; grid-template-columns: 170px 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; max-width: 760px; min-height: 420px; overflow: hidden; }
  .window.no-sidebar { grid-template-columns: 1fr; }
  .sidebar { border-right: 1px solid var(--line); padding: 8px 6px; min-width: 0; overflow: auto; max-height: 560px; }
  .sidebar h3 { font-size: 12px; color: var(--muted); margin: 8px 6px 4px; font-weight: 650; }
  .sidebar button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 4px; padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar button:hover { background: var(--accent-soft); }
  .sidebar button[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
  .sidebar .plus { color: var(--accent); font-size: 13px; }
  .sidebar .sample { font-style: italic; color: var(--muted); }
  .content { padding: 12px; min-width: 0; }
  .sheet-name { font-size: 18px; font-weight: 650; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .sheet-name small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; container-type: inline-size; }
  .section { grid-column: span 2; border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
  .section.half { grid-column: span 1; }
  @container (max-width: 480px) { .section.half { grid-column: span 2; } }
  .section h2 { font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 0 6px; }
  .grid { display: grid; gap: 4px 6px; align-items: center; }
  .block { padding: 6px 0; border-top: 1px dashed var(--line); }
  .block:first-of-type { border-top: 0; }
  .cell { position: relative; min-width: 0; border-radius: 4px; }
  .cell.text { color: var(--muted); font-size: 13px; }
  .cell input[type="text"], .cell input[type="number"] { width: 100%; min-width: 0; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--field); }
  .cell input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .dice { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .add { margin-top: 6px; }
  .cell.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  .section.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty-note { color: var(--muted); margin: 0 0 10px; font-size: 13px; }

  /* Click models, set on <html data-click> by the current view. */
  [data-click="select"] .content .cell { cursor: pointer; }
  [data-click="select"] .content .cell:hover { outline: 1px dashed var(--accent); }
  [data-click="select"] .content input,
  [data-click="select"] .content .dice,
  [data-click="select"] .content .add { pointer-events: none; }
  [data-click="select"] .content .cell input { opacity: 0.7; }
  [data-click="data"] .content .cell.selected { outline-style: dotted; outline-width: 1px; }
  [data-click="dbl"] .content .cell:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  [data-click="dbl"] .content .cell input { cursor: default; caret-color: transparent; }
  [data-click="dbl"] .content .cell.selected input { cursor: text; }
  [data-click="dbl"] .content .cell.editing input { caret-color: auto; box-shadow: 0 0 0 2px var(--accent); }

  /* The table of a template's sheets (design D). */
  .table-wrap { overflow: auto; max-width: 100%; }
  table.data { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  table.data th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.data td input { width: 100%; min-width: 64px; padding: 3px 5px; border-radius: 4px; border: 1px solid transparent; background: transparent; }
  table.data td input:focus { border-color: var(--accent); background: var(--field); outline: none; }
  table.data td:first-child input { min-width: 150px; }
  table.data td.count { color: var(--muted); white-space: nowrap; }
  table.data input[type="checkbox"] { width: 16px; min-width: 0; accent-color: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 150ms ease-out; }
  .toast.on { opacity: 1; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); }
    .tree { max-height: 32vh; }
    .window { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 180px; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Конструктор пресетов</h1>
  <button class="btn" type="button">Открыть…</button>
  <button class="btn" type="button" aria-label="Отменить правку">↶</button>
  <button class="btn" type="button" aria-label="Повторить правку">↷</button>
  <span class="ok">Проблем нет</span>
  <span class="spacer"></span>
  <button class="btn" type="button">Скачать снимок</button>
  <button class="btn primary" type="button">Скачать пресет</button>
</header>

<div class="layout">
  <section class="left">
    <h2 class="panel-title" id="left-title">Структура</h2>
    <ul class="tree" id="tree"></ul>
    <div class="form" id="form"></div>
  </section>
  <section class="right">
    <div class="preview-head">
      <h2 class="panel-title" id="preview-title">Превью · окно 600 × 600</h2>
      <div class="segmented" role="group" aria-label="Что показывает превью" data-for-design="window table">
        <button type="button" data-set-mode="structure">Структура</button>
        <button type="button" data-set-mode="data">Данные</button>
      </div>
    </div>
    <div id="above"></div>
    <div id="stage"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="grill-round">
{
  "question": "Где в конструкторе живут листы снимка и как между ними переходить?",
  "designs": [
    { "id": "window", "name": "режимы, данные как окно", "angle": "(1) в «Данных» превью становится окном расширения: слева «Листы» снимка, «+ Добавить» в каждом наборе", "cost": "в «Структуре» и в «Данных» превью выглядит по-разному" },
    { "id": "sidebar", "name": "двойной клик, окно всегда", "angle": "(3) превью всегда окно расширения со списком листов снимка; выбор узла идёт с любого листа", "cost": "пока в наборе нет листов, структуру не на чем кликать: показан бледный образец" },
    { "id": "strip", "name": "двойной клик, полоса листов", "angle": "(3) над листом полоса «Образец · Ирма · Борис · +» для одного шаблона; образец только для структуры", "cost": "при 20 NPC полоса уходит за край, а другой шаблон — отдельный переключатель" },
    { "id": "table", "name": "режимы, данные таблицей", "angle": "(1) в «Данных» каждый шаблон — таблица: строка на лист или блок, столбец на поле", "cost": "вводишь без раскладки листа, повторы внутри листа показаны только числом" },
    { "id": "lefttree", "name": "снимок в дереве", "angle": "(1) режима-переключателя нет: слева под «Пресетом» есть «Снимок» со списком листов; выбрал узел — структура, выбрал лист — данные", "cost": "режим остался, только неявный, а левая панель становится длинной" }
  ],
  "states": [
    { "id": "few", "name": "2 персонажа" },
    { "id": "many", "name": "8 персонажей, 6 NPC" },
    { "id": "none", "name": "снимок пустой" }
  ]
}
</script>
<script>
// grill-design picker: a draggable dock that switches the designs of one round.
//
// Inline this file into the round's HTML, after the round's JSON block: a
// script element of type application/json with id grill-round, holding
// { question, designs: [{ id, name, angle, cost }], states: [{ id, name }] }.
// This file never spells out a closing script tag, because the HTML parser
// would end the inline script at it.
//
// The live choice is written to data-design and data-state on the html
// element, so each design styles itself under [data-design="<id>"]. Elements marked
// data-for-design="<id> <id>" or data-for-state="<id>" are hidden unless the
// live choice is listed. Every switch dispatches a "grill:change" event on
// document with { design, state, replay } in detail.
//
// Ideas borrowed from the variate card (github.com/Nutlope/variate, MIT).

(() => {
  "use strict";

  const source = document.getElementById("grill-round");
  if (!source) {
    console.error("grill-design picker: no application/json script with id grill-round");
    return;
  }
  let round;
  try {
    round = JSON.parse(source.textContent);
  } catch (error) {
    console.error("grill-design picker: grill-round is not valid JSON", error);
    return;
  }
  const designs = Array.isArray(round.designs) ? round.designs : [];
  const states = Array.isArray(round.states) ? round.states : [];
  if (!designs.length) {
    console.error("grill-design picker: grill-round has no designs");
    return;
  }

  const root = document.documentElement;
  const POSITION_KEY = "grill-design:dock-position";

  // localStorage throws in private windows and sandboxed previews; the dock
  // must still work there, it only forgets where it was dragged.
  const storage = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} },
  };

  const fromHash = () => {
    const params = new URLSearchParams(location.hash.slice(1));
    return { design: params.get("design"), state: params.get("state") };
  };
  const known = (list, id) => list.some((item) => item.id === id);

  const initial = fromHash();
  let design = known(designs, initial.design) ? initial.design : designs[0].id;
  let state = states.length ? (known(states, initial.state) ? initial.state : states[0].id) : null;

  function applyChoice(replay) {
    root.dataset.design = design;
    if (state) root.dataset.state = state; else delete root.dataset.state;
    for (const node of document.querySelectorAll("[data-for-design]")) {
      node.hidden = !node.dataset.forDesign.split(/\s+/).includes(design);
    }
    for (const node of document.querySelectorAll("[data-for-state]")) {
      node.hidden = !node.dataset.forState.split(/\s+/).includes(state);
    }
    const hash = new URLSearchParams({ design, ...(state ? { state } : {}) });
    history.replaceState(null, "", `#${hash}`);
    document.dispatchEvent(new CustomEvent("grill:change", { detail: { design, state, replay } }));
    render();
  }

  // Re-entering the same design restarts its CSS animations, so a round about
  // motion can be watched more than once.
  function replay() {
    delete root.dataset.design;
    void root.offsetWidth;
    applyChoice(true);
  }

  function selectDesign(id) {
    if (id === design) { replay(); return; }
    design = id;
    applyChoice(false);
  }

  function step(delta) {
    const index = designs.findIndex((item) => item.id === design);
    selectDesign(designs[(index + delta + designs.length) % designs.length].id);
  }

  // The dock lives in a shadow root reset with all: initial, so the designs
  // under review cannot restyle it and it cannot leak into them.
  const host = document.createElement("grill-picker");
  const shadow = host.attachShadow({ mode: "open" });
  shadow.innerHTML = `
<style>
:host { all: initial; display: block; position: fixed; right: 16px; bottom: 16px; z-index: 2147483646; }
@media print { :host { display: none } }
* { box-sizing: border-box; margin: 0; }
.dock {
  width: min(320px, calc(100vw - 32px));
  padding: 10px 12px 12px;
  border-radius: 12px;
  background: #16181d;
  color: #e8e9ed;
  box-shadow: 0 8px 28px rgb(0 0 0 / .35), 0 0 0 1px rgb(255 255 255 / .08);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
.grip {
  display: flex; align-items: center; gap: 8px;
  cursor: grab; touch-action: none; user-select: none;
  color: #9a9ea8; font-size: 12px;
}
.grip:active { cursor: grabbing; }
.grip::before { content: "⋮⋮"; letter-spacing: -2px; }
.question { color: #e8e9ed; font-weight: 600; }
.pager { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
button {
  all: unset; box-sizing: border-box;
  min-width: 28px; height: 28px; padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 7px; background: #23262d; color: #c9ccd3;
  font: inherit; cursor: pointer; white-space: nowrap;
}
button:hover { background: #2d3139; }
button:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 1px; }
button[aria-pressed="true"] { background: #e8e9ed; color: #16181d; font-weight: 600; }
.detail { margin-top: 8px; color: #b4b8c1; }
.detail b { color: #e8e9ed; font-weight: 600; }
.cost { color: #f0b37e; }
.states { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2d3139; }
.keys { margin-top: 8px; color: #6f7480; font-size: 11px; }
</style>
<div class="dock" role="region" aria-label="Design picker">
  <div class="grip"><span class="question"></span></div>
  <div class="pager" role="group" aria-label="Designs"></div>
  <p class="detail" aria-live="polite"></p>
  <div class="states" role="group" aria-label="States"></div>
  <p class="keys">← → or 1–9 switch · click the current design to replay it</p>
</div>`;

  const dock = shadow.querySelector(".dock");
  const grip = shadow.querySelector(".grip");
  const pager = shadow.querySelector(".pager");
  const detail = shadow.querySelector(".detail");
  const stateBar = shadow.querySelector(".states");
  shadow.querySelector(".question").textContent = round.question || "Pick a design";
  if (!states.length) stateBar.remove();

  const designButtons = designs.map((item, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.addEventListener("click", () => selectDesign(item.id));
    button.dataset.number = String(index + 1);
    pager.append(button);
    return button;
  });
  const stateButtons = states.map((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.name || item.id;
    button.addEventListener("click", () => { state = item.id; applyChoice(false); });
    stateBar.append(button);
    return button;
  });

  function render() {
    designs.forEach((item, index) => {
      const live = item.id === design;
      const button = designButtons[index];
      // The live chip wears its name and the rest stay numbers, so the dock
      // stays narrow while always saying what is on screen.
      button.textContent = live ? `${index + 1} · ${item.name || item.id}` : String(index + 1);
      button.setAttribute("aria-pressed", String(live));
      button.title = [item.name, item.angle, item.cost && `cost: ${item.cost}`].filter(Boolean).join(" — ");
    });
    stateButtons.forEach((button, index) => {
      button.setAttribute("aria-pressed", String(states[index].id === state));
    });
    const current = designs.find((item) => item.id === design);
    detail.replaceChildren();
    if (current.angle) {
      const angle = document.createElement("b");
      angle.textContent = current.angle;
      detail.append(angle);
    }
    if (current.cost) {
      const cost = document.createElement("span");
      cost.className = "cost";
      cost.textContent = `${current.angle ? " · " : ""}cost: ${current.cost}`;
      detail.append(cost);
    }
    detail.hidden = !current.angle && !current.cost;
  }

  function onKey(event) {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
    const target = event.composedPath()[0];
    if (target instanceof HTMLElement && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
    if (event.key === "ArrowRight") { step(1); event.preventDefault(); return; }
    if (event.key === "ArrowLeft") { step(-1); event.preventDefault(); return; }
    const number = Number(event.key);
    if (Number.isInteger(number) && number >= 1 && number <= designs.length) {
      selectDesign(designs[number - 1].id);
      event.preventDefault();
    }
  }

  function place(position) {
    if (!position) return;
    const maxX = Math.max(0, innerWidth - dock.offsetWidth);
    const maxY = Math.max(0, innerHeight - dock.offsetHeight);
    host.style.left = `${Math.min(Math.max(0, position.x), maxX)}px`;
    host.style.top = `${Math.min(Math.max(0, position.y), maxY)}px`;
    host.style.right = "auto";
    host.style.bottom = "auto";
  }

  grip.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const box = host.getBoundingClientRect();
    const offsetX = event.clientX - box.left;
    const offsetY = event.clientY - box.top;
    grip.setPointerCapture(event.pointerId);
    const move = (moveEvent) => place({ x: moveEvent.clientX - offsetX, y: moveEvent.clientY - offsetY });
    const end = () => {
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", end);
      grip.removeEventListener("pointercancel", end);
      const placed = host.getBoundingClientRect();
      storage.set(POSITION_KEY, { x: placed.left, y: placed.top });
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", end);
    grip.addEventListener("pointercancel", end);
  });

  addEventListener("keydown", onKey);
  addEventListener("hashchange", () => {
    const next = fromHash();
    if (known(designs, next.design)) design = next.design;
    if (known(states, next.state)) state = next.state;
    applyChoice(false);
  });
  addEventListener("resize", () => { if (host.style.left) place({ x: parseFloat(host.style.left), y: parseFloat(host.style.top) }); });

  document.body.append(host);
  place(storage.get(POSITION_KEY));
  applyChoice(false);
})();

</script>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  let seq = 0;
  const T = (text) => ({ uid: "t" + seq++, kind: "text", text });
  const F = (id, type, name) => ({ uid: "f-" + id, kind: "field", id, type, name: name || "" });
  const D = (formula) => ({ uid: "d" + seq++, kind: "dice", formula });

  const TEMPLATES = [
    { id: "pc", kind: "set", title: "Персонажи", nameField: "name", sections: [
      { uid: "s-char", title: "Персонаж", cols: 4, rows: [
        [T("Имя"), F("name", "text"), T("Предыстория"), F("background", "text")],
        [T("Возраст"), F("age", "number"), T("Монеты, зм"), F("gold", "number")],
      ] },
      { uid: "s-attr", title: "Характеристики", cols: 4, half: true, rows: [
        [T(""), T("Тек."), T("Макс."), T("Спасбросок")],
        [T("STR"), F("str", "number"), F("str_max", "number", "STR, максимум"), D("1d20 <= str")],
        [T("DEX"), F("dex", "number"), F("dex_max", "number", "DEX, максимум"), D("1d20 <= dex")],
        [T("WIL"), F("wil", "number"), F("wil_max", "number", "WIL, максимум"), D("1d20 <= wil")],
      ] },
      { uid: "s-def", title: "Защита", cols: 4, half: true, rows: [
        [T("HP"), F("hp", "number"), T("из"), F("hp_max", "number", "HP, максимум")],
        [T("Броня"), F("armor", "number"), T("Лишения"), F("deprived", "check")],
      ] },
      { uid: "s-weap", title: "Оружие", cols: 4, repeat: true, rows: [
        [T("Название"), F("weapon", "text"), T("Урон"), F("damage", "text")],
      ] },
    ] },
    { id: "npc", kind: "single", title: "NPC", sections: [
      { uid: "s-npc", title: "NPC", cols: 4, repeat: true, rows: [
        [T("Имя"), F("npc_name", "text"), T("HP"), F("npc_hp", "number")],
        [T("Броня"), F("npc_armor", "number"), T("Атака"), F("npc_attack", "text")],
      ] },
    ] },
  ];
  const TYPE_NAME = { text: "текст", number: "число", check: "флажок" };

  // Node index: every template, section, row and cell by uid.
  const byUid = new Map();
  const parentOf = new Map();
  for (const tpl of TEMPLATES) {
    byUid.set("tpl-" + tpl.id, { type: "template", node: tpl, tpl });
    for (const section of tpl.sections) {
      byUid.set(section.uid, { type: "section", node: section, tpl });
      parentOf.set(section.uid, "tpl-" + tpl.id);
      section.rows.forEach((row, index) => {
        const rowUid = section.uid + "-r" + index;
        byUid.set(rowUid, { type: "row", node: row, index, section, tpl });
        parentOf.set(rowUid, section.uid);
        for (const cell of row) {
          byUid.set(cell.uid, { type: cell.kind, node: cell, section, tpl, rowUid });
          parentOf.set(cell.uid, rowUid);
        }
      });
    }
  }
  const tplOf = (uid) => byUid.get(uid)?.tpl ?? TEMPLATES[0];

  const PCS = [
    ["Ирма Солодовник", "Травница", 23, 14, 11, 14, 9, 3, 1, [["Кинжал", "d6"], ["Праща", "d4"]]],
    ["Борис Кожемяка", "Кузнец", 31, 6, 15, 9, 10, 5, 2, [["Молот", "d8"]]],
    ["Сив из Ольшан", "Охотница", 19, 22, 10, 16, 11, 4, 1, [["Лук", "d6"], ["Нож", "d4"]]],
    ["Брат Тихон", "Расстрига", 44, 3, 9, 8, 15, 3, 0, []],
    ["Мара Вдовая", "Контрабандистка", 36, 41, 12, 13, 12, 4, 1, [["Сабля", "d6"]]],
    ["Ярек Пёс", "Наёмник", 28, 17, 14, 12, 7, 6, 3, [["Алебарда", "d10"]]],
    ["Улла Ткачиха", "Ткачиха", 52, 9, 8, 10, 14, 2, 0, [["Посох", "d6"]]],
    ["Гнат Рыжий", "Крысолов", 17, 2, 10, 15, 9, 3, 1, [["Дубинка", "d6"]]],
  ];
  const NPCS = [
    ["Трактирщик Ус", 4, 0, "Скалка d6"], ["Болотная ведьма", 9, 1, "Порча d8"], ["Стражник", 5, 1, "Копьё d8"],
    ["Волчица", 6, 0, "Укус d6"], ["Лодочник", 3, 0, "Багор d6"], ["Чёрный рыцарь", 12, 3, "Меч d10"],
  ];
  function pcSheet(row, i) {
    const [name, background, age, gold, str, dex, wil, hp, armor, weapons] = row;
    return { sid: "pc" + i, tpl: "pc", v: { name, background, age, gold, str, str_max: str, dex, dex_max: dex, wil, wil_max: wil, hp, hp_max: hp + 1, armor, deprived: false, "s-weap": weapons.map(([weapon, damage]) => ({ weapon, damage })) } };
  }
  function snapshotFor(state) {
    const pcs = state === "none" ? [] : PCS.slice(0, state === "many" ? 8 : 2).map(pcSheet);
    const npcs = state === "none" ? [] : NPCS.slice(0, state === "many" ? 6 : 2);
    const npc = { sid: "npc", tpl: "npc", v: { "s-npc": npcs.map(([npc_name, npc_hp, npc_armor, npc_attack]) => ({ npc_name, npc_hp, npc_armor, npc_attack })) } };
    return [...pcs, npc];
  }

  let sheets = [];
  let selected = "f-hp";
  let view = { kind: "sheet", sid: "pc0" };
  let mode = "structure";
  let editing = null;
  let addSeq = 0;
  let tableTpl = "pc";

  const design = () => root.dataset.design;
  const sheetsOf = (tplId) => sheets.filter((s) => s.tpl === tplId);
  const sheetById = (sid) => sheets.find((s) => s.sid === sid);
  const sheetName = (sheet) => {
    const tpl = TEMPLATES.find((t) => t.id === sheet.tpl);
    return tpl.kind === "single" ? tpl.title : (sheet.v.name || "Без имени");
  };

  // Which template the preview shows when it is not a sheet.
  function firstSheetOf(tplId) { return sheetsOf(tplId)[0]?.sid; }
  function showTemplateOrSheet(tplId) {
    const sid = firstSheetOf(tplId);
    view = sid ? { kind: "sheet", sid } : { kind: "template", tpl: tplId };
  }

  // What a click on a cell means right now.
  function clickModel() {
    const d = design();
    if (d === "window" || d === "table") return mode === "structure" ? "select" : "data";
    if (d === "sidebar") return view.kind === "sheet" ? "dbl" : "select";
    if (d === "strip") return view.kind === "sheet" ? "dbl" : "select";
    return view.kind === "sheet" ? "data" : "select";
  }

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));
    }
    return node;
  }

  let toastTimer = 0;
  function toast(text) {
    const box = document.getElementById("toast");
    box.textContent = text;
    box.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => box.classList.remove("on"), 2200);
  }
  function roll(formula, values) {
    const stat = formula.split("<=")[1]?.trim();
    const die = 1 + Math.floor(Math.random() * 20);
    const target = values?.[stat];
    const verdict = target === undefined || target === "" ? "нет значения " + stat : die <= Number(target) ? "успех" : "провал";
    toast(formula.replace("<=", "≤") + " → " + die + " · " + verdict);
  }

  function addSheet(tplId) {
    const sid = "new" + addSeq++;
    sheets.push({ sid, tpl: tplId, v: { "s-weap": [] } });
    view = { kind: "sheet", sid };
    if (design() === "window" || design() === "table") mode = "data";
    render();
  }

  function select(uid) {
    selected = uid;
    editing = null;
    const tpl = tplOf(uid);
    const shownTpl = view.kind === "sheet" ? sheetById(view.sid)?.tpl : view.tpl;
    if (shownTpl !== tpl.id) {
      if (design() === "strip" || design() === "lefttree") view = { kind: "template", tpl: tpl.id };
      else showTemplateOrSheet(tpl.id);
    }
    if (design() === "lefttree") view = { kind: "template", tpl: tpl.id };
    render();
  }

  // --- the sheet ---
  function renderCell(cell, values, block, sectionUid) {
    const classes = ["cell", cell.kind];
    if (cell.uid === selected) classes.push("selected");
    const key = cell.uid + "|" + (block ?? "");
    if (editing === key) classes.push("editing");
    const wrap = el("div", { class: classes.join(" "), "data-uid": cell.uid });
    const target = block === undefined ? values : values?.[sectionUid]?.[block];
    const click = clickModel();

    if (cell.kind === "text") wrap.append(cell.text || " ");
    if (cell.kind === "dice") wrap.append(el("button", { class: "dice", type: "button", title: cell.formula.replace("<=", "≤") }, "🎲 " + cell.formula.split(" ")[0]));
    if (cell.kind === "field") {
      const current = target?.[cell.id];
      const locked = click === "select" || (click === "dbl" && editing !== key) || !target;
      if (cell.type === "check") {
        const box = el("input", { type: "checkbox", checked: current === true, "aria-label": cell.name || cell.id });
        box.addEventListener("click", (event) => {
          if (locked || click === "dbl") { event.preventDefault(); return; }
          target[cell.id] = box.checked;
        });
        wrap.append(box);
      } else {
        const input = el("input", { type: cell.type, value: current ?? "", readOnly: locked, "aria-label": cell.name || cell.id });
        input.addEventListener("mousedown", (event) => { if (locked) event.preventDefault(); });
        input.addEventListener("input", () => {
          target[cell.id] = cell.type === "number" && input.value !== "" ? Number(input.value) : input.value;
          if (cell.id === "name") refreshNames();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && click === "dbl") { editing = null; render(); }
        });
        wrap.append(input);
      }
    }

    wrap.addEventListener("click", (event) => {
      const model = clickModel();
      if (model === "select") { select(cell.uid); return; }
      if (model === "data") {
        if (event.target.closest(".dice")) roll(cell.formula, values);
        return;
      }
      // Double-click model: the first click selects, the next one acts.
      if (selected !== cell.uid) { event.preventDefault(); select(cell.uid); return; }
      if (cell.kind === "dice") { roll(cell.formula, values); return; }
      if (cell.kind !== "field" || !target) return;
      if (cell.type === "check") { target[cell.id] = target[cell.id] !== true; render(); return; }
      editing = key;
      render();
      const input = document.querySelector('.cell.editing input');
      if (input) { input.focus(); input.select(); }
    });
    return wrap;
  }

  function renderSheetBody(tpl, values, label, note) {
    const box = el("div", { class: "content" });
    box.append(el("p", { class: "sheet-name" }, label, note ? el("small", {}, note) : null));
    const sections = el("div", { class: "sections" });
    for (const section of tpl.sections) {
      const sbox = el("div", { class: "section" + (section.half ? " half" : "") + (selected === section.uid ? " selected" : "") });
      const title = el("h2", {}, section.title);
      title.addEventListener("click", () => { if (clickModel() !== "data") select(section.uid); });
      sbox.append(title);
      const columns = "repeat(" + section.cols + ", minmax(0, 1fr))";
      if (section.repeat) {
        const blocks = values ? values[section.uid] ?? [] : [{}];
        if (values && blocks.length === 0) sbox.append(el("p", { class: "empty-note" }, "Блоков нет."));
        blocks.forEach((_, block) => {
          const grid = el("div", { class: "grid block" });
          grid.style.gridTemplateColumns = columns;
          for (const row of section.rows) for (const cell of row) grid.append(renderCell(cell, values, values ? block : undefined, section.uid));
          sbox.append(grid);
        });
        if (values) {
          sbox.append(el("button", { class: "btn add", type: "button", onclick: () => {
            if (!values[section.uid]) values[section.uid] = [];
            values[section.uid].push({});
            render();
          } }, "Добавить"));
        }
      } else {
        const grid = el("div", { class: "grid" });
        grid.style.gridTemplateColumns = columns;
        for (const row of section.rows) for (const cell of row) grid.append(renderCell(cell, values));
        sbox.append(grid);
      }
      sections.append(sbox);
    }
    box.append(sections);
    return box;
  }

  function shownSheetContent() {
    if (view.kind === "sheet") {
      const sheet = sheetById(view.sid);
      if (sheet) return renderSheetBody(TEMPLATES.find((t) => t.id === sheet.tpl), sheet.v, sheetName(sheet));
    }
    const tpl = TEMPLATES.find((t) => t.id === (view.tpl ?? "pc"));
    return renderSheetBody(tpl, null, "Образец", tpl.title + " · только структура");
  }

  // --- the window sidebar ---
  function sidebarOfSheets() {
    const side = el("nav", { class: "sidebar", "aria-label": "Листы" });
    for (const tpl of TEMPLATES) {
      if (tpl.kind === "single") {
        const sheet = sheetsOf(tpl.id)[0];
        side.append(el("h3", {}, tpl.title));
        side.append(el("button", { type: "button", "aria-current": String(view.sid === sheet.sid), onclick: () => { view = { kind: "sheet", sid: sheet.sid }; render(); } }, tpl.title));
        continue;
      }
      side.append(el("h3", {}, tpl.title + " · " + sheetsOf(tpl.id).length));
      const list = sheetsOf(tpl.id);
      if (list.length === 0 && design() === "sidebar") {
        side.append(el("button", { type: "button", class: "sample", "aria-current": String(view.kind === "template" && view.tpl === tpl.id), onclick: () => { view = { kind: "template", tpl: tpl.id }; render(); } }, "Образец"));
      }
      for (const sheet of list) {
        side.append(el("button", { type: "button", "aria-current": String(view.sid === sheet.sid), onclick: () => { view = { kind: "sheet", sid: sheet.sid }; editing = null; render(); } }, sheetName(sheet)));
      }
      side.append(el("button", { type: "button", class: "plus", onclick: () => addSheet(tpl.id) }, "+ Добавить"));
    }
    return side;
  }
  function sidebarOfTemplates() {
    const side = el("nav", { class: "sidebar", "aria-label": "Шаблоны" });
    side.append(el("h3", {}, "Шаблоны"));
    for (const tpl of TEMPLATES) {
      side.append(el("button", { type: "button", "aria-current": String(view.kind === "template" && view.tpl === tpl.id), onclick: () => select("tpl-" + tpl.id) }, tpl.title));
    }
    return side;
  }

  // --- the table of sheets (design D) ---
  function renderTable() {
    const tpl = TEMPLATES.find((t) => t.id === tableTpl);
    const wrap = el("div", { class: "content" });
    const tabs = el("div", { class: "segmented tpl-switch", role: "group", "aria-label": "Шаблон" });
    for (const other of TEMPLATES) {
      tabs.append(el("button", { type: "button", "aria-pressed": String(other.id === tpl.id), onclick: () => { tableTpl = other.id; render(); } }, other.title));
    }
    wrap.append(tabs);
    const flat = tpl.sections.filter((s) => !s.repeat).flatMap((s) => s.rows.flat()).filter((c) => c.kind === "field");
    const repeats = tpl.sections.filter((s) => s.repeat);
    const table = el("table", { class: "data" });
    let rows;
    let fields;
    if (tpl.kind === "single") {
      const sheet = sheetsOf(tpl.id)[0];
      fields = repeats.flatMap((s) => s.rows.flat()).filter((c) => c.kind === "field");
      rows = (sheet.v[repeats[0].uid] ?? []).map((block) => ({ target: block, extra: null }));
      table.append(el("thead", {}, el("tr", {}, fields.map((f) => el("th", {}, f.name || f.id)))));
    } else {
      fields = flat;
      rows = sheetsOf(tpl.id).map((sheet) => ({ target: sheet.v, extra: repeats.map((s) => s.title + ": " + (sheet.v[s.uid]?.length ?? 0)).join(", ") }));
      table.append(el("thead", {}, el("tr", {}, fields.map((f) => el("th", {}, f.id)), repeats.length ? el("th", {}, "Повторы") : null)));
    }
    const body = el("tbody");
    for (const row of rows) {
      const tr = el("tr");
      for (const f of fields) {
        const input = f.type === "check"
          ? el("input", { type: "checkbox", checked: row.target[f.id] === true, onchange: (e) => { row.target[f.id] = e.target.checked; } })
          : el("input", { type: f.type, value: row.target[f.id] ?? "", "aria-label": f.id, oninput: (e) => { row.target[f.id] = e.target.value; } });
        input.addEventListener("focus", () => { selected = f.uid; renderLeft(); });
        tr.append(el("td", {}, input));
      }
      if (row.extra !== null) tr.append(el("td", { class: "count" }, row.extra));
      body.append(tr);
    }
    table.append(body);
    wrap.append(el("div", { class: "table-wrap" }, table));
    if (rows.length === 0) wrap.append(el("p", { class: "empty-note" }, tpl.kind === "single" ? "Блоков нет." : "Листов нет."));
    wrap.append(el("button", { class: "btn add", type: "button", onclick: () => {
      if (tpl.kind === "single") { const sheet = sheetsOf(tpl.id)[0]; (sheet.v[repeats[0].uid] ??= []).push({}); }
      else sheets.push({ sid: "new" + addSeq++, tpl: tpl.id, v: { "s-weap": [] } });
      render();
    } }, "Добавить"));
    return wrap;
  }

  // --- left panel ---
  function treeLabel(uid) {
    const entry = byUid.get(uid);
    if (entry.type === "template") return [entry.node.title, entry.node.kind === "set" ? "набор" : "одиночный лист"];
    if (entry.type === "section") return [entry.node.title, entry.node.repeat ? "секция · повтор" : "секция"];
    if (entry.type === "row") return ["Строка " + (entry.index + 1), ""];
    if (entry.type === "text") return ["«" + (entry.node.text || "…") + "»", "подпись"];
    if (entry.type === "dice") return [entry.node.formula, "кубик"];
    return [entry.node.id, TYPE_NAME[entry.node.type]];
  }

  function renderLeft() {
    const tree = document.getElementById("tree");
    tree.replaceChildren();
    const path = new Set();
    for (let uid = selected; uid; uid = parentOf.get(uid)) path.add(uid);
    const nodeActive = !(design() === "lefttree" && view.kind === "sheet");
    const item = (uid, depth) => {
      const [name, kind] = treeLabel(uid);
      const button = el("button", { type: "button", "aria-current": String(nodeActive && uid === selected), onclick: () => select(uid) }, name, kind ? el("span", { class: "kind" }, " · " + kind) : null);
      button.style.paddingLeft = 8 + depth * 14 + "px";
      tree.append(el("li", {}, button));
    };
    if (design() === "lefttree") tree.append(el("li", { class: "root" }, "Пресет"));
    for (const tpl of TEMPLATES) {
      item("tpl-" + tpl.id, 0);
      if (!path.has("tpl-" + tpl.id)) continue;
      for (const section of tpl.sections) {
        item(section.uid, 1);
        if (!path.has(section.uid)) continue;
        section.rows.forEach((row, index) => {
          const rowUid = section.uid + "-r" + index;
          item(rowUid, 2);
          if (path.has(rowUid)) for (const cell of row) item(cell.uid, 3);
        });
      }
    }
    if (design() === "lefttree") {
      tree.append(el("li", { class: "root" }, "Снимок"));
      for (const tpl of TEMPLATES) {
        if (tpl.kind === "single") {
          const sheet = sheetsOf(tpl.id)[0];
          const b = el("button", { type: "button", "aria-current": String(view.sid === sheet.sid), onclick: () => { view = { kind: "sheet", sid: sheet.sid }; render(); } }, tpl.title, el("span", { class: "kind" }, " · блоков " + (sheet.v["s-npc"]?.length ?? 0)));
          tree.append(el("li", {}, b));
          continue;
        }
        tree.append(el("li", {}, el("button", { type: "button", disabled: true }, tpl.title, el("span", { class: "kind" }, " · листов " + sheetsOf(tpl.id).length))));
        for (const sheet of sheetsOf(tpl.id)) {
          const b = el("button", { type: "button", "aria-current": String(view.sid === sheet.sid), onclick: () => { view = { kind: "sheet", sid: sheet.sid }; render(); } }, sheetName(sheet));
          b.style.paddingLeft = "22px";
          tree.append(el("li", {}, b));
        }
        const add = el("button", { type: "button", class: "add-sheet", onclick: () => addSheet(tpl.id) }, "+ Добавить");
        add.style.paddingLeft = "22px";
        tree.append(el("li", {}, add));
      }
    }

    const form = document.getElementById("form");
    form.replaceChildren();
    if (design() === "lefttree" && view.kind === "sheet") {
      const sheet = sheetById(view.sid);
      form.append(el("h2", { class: "panel-title", style: "padding:12px 0 0" }, "Лист · " + sheetName(sheet)));
      form.append(el("p", { class: "hint" }, "Значения вписываются прямо в превью. Чтобы поменять структуру, выберите узел под «Пресетом»."));
      form.append(el("button", { class: "btn", type: "button", style: "margin-top:12px", onclick: () => { sheets = sheets.filter((s) => s !== sheet || s.tpl === "npc"); showTemplateOrSheet(sheet.tpl); render(); } }, "Удалить лист"));
      return;
    }
    const entry = byUid.get(selected);
    const [name, kind] = treeLabel(selected);
    form.append(el("h2", { class: "panel-title", style: "padding:12px 0 0" }, name + (kind ? " · " + kind : "")));
    const field = (label, input) => [el("label", {}, label), input];
    if (entry.type === "field") {
      form.append(...field("Id", el("input", { value: entry.node.id })));
      form.append(...field("Тип", el("select", {}, el("option", {}, TYPE_NAME[entry.node.type]))));
      form.append(...field("Имя", el("input", { value: entry.node.name, placeholder: "Как в истории бросков" })));
      form.append(...field("Видят", el("select", {}, el("option", {}, "Все"), el("option", {}, "Только мастер"))));
    } else if (entry.type === "text") {
      const input = el("input", { value: entry.node.text });
      input.addEventListener("input", () => { entry.node.text = input.value; renderStage(); });
      form.append(...field("Подпись", input));
    } else if (entry.type === "dice") {
      form.append(...field("Формула", el("input", { value: entry.node.formula })));
    } else if (entry.type === "section") {
      form.append(...field("Заголовок", el("input", { value: entry.node.title })));
      form.append(...field("Колонки", el("input", { type: "number", value: entry.node.cols })));
    } else if (entry.type === "template") {
      form.append(...field("Заголовок", el("input", { value: entry.node.title })));
      form.append(...field("Вид", el("select", {}, el("option", {}, entry.node.kind === "set" ? "Набор" : "Одиночный лист"))));
    } else {
      form.append(el("p", { class: "hint" }, "Выберите ячейку в превью или узел в дереве."));
    }
  }

  // A typed name renames the sheet in every list without a full redraw, so the input keeps focus.
  function refreshNames() {
    const sheet = view.kind === "sheet" ? sheetById(view.sid) : null;
    if (!sheet) return;
    for (const node of document.querySelectorAll('[aria-current="true"]')) {
      if (node.closest(".sidebar, .strip") || (node.closest(".tree") && node.textContent && !node.querySelector(".kind"))) node.textContent = sheetName(sheet);
    }
    const name = document.querySelector(".content .sheet-name");
    if (name) name.firstChild.textContent = sheetName(sheet);
  }

  // --- the preview stage ---
  function renderChrome() {
    for (const button of document.querySelectorAll("[data-set-mode]")) button.setAttribute("aria-pressed", String(button.dataset.setMode === mode));
  }

  function renderStage() {
    const above = document.getElementById("above");
    const stage = document.getElementById("stage");
    above.replaceChildren();
    stage.replaceChildren();
    const d = design();
    root.dataset.click = clickModel();

    if (d === "window") {
      const win = el("div", { class: "window" });
      if (mode === "structure") {
        if (view.kind === "sheet") view = { kind: "template", tpl: sheetById(view.sid)?.tpl ?? "pc" };
        win.append(sidebarOfTemplates(), shownSheetContent());
      } else {
        if (view.kind === "template") showTemplateOrSheet(view.tpl);
        if (view.kind === "template") view = { kind: "sheet", sid: sheets[0].sid };
        root.dataset.click = clickModel();
        win.append(sidebarOfSheets(), shownSheetContent());
      }
      stage.append(win);
      return;
    }
    if (d === "sidebar") {
      stage.append(el("div", { class: "window" }, sidebarOfSheets(), shownSheetContent()));
      return;
    }
    if (d === "strip") {
      const tplId = view.kind === "sheet" ? sheetById(view.sid)?.tpl : view.tpl;
      const tpl = TEMPLATES.find((t) => t.id === (tplId ?? "pc"));
      const switcher = el("div", { class: "segmented tpl-switch", role: "group", "aria-label": "Шаблон" });
      for (const other of TEMPLATES) switcher.append(el("button", { type: "button", "aria-pressed": String(other.id === tpl.id), onclick: () => { view = { kind: "template", tpl: other.id }; render(); } }, other.title));
      const strip = el("div", { class: "strip", role: "tablist", "aria-label": "Листы" });
      strip.append(el("button", { type: "button", class: "sample", "aria-current": String(view.kind === "template"), onclick: () => { view = { kind: "template", tpl: tpl.id }; editing = null; render(); } }, "Образец"));
      for (const sheet of sheetsOf(tpl.id)) strip.append(el("button", { type: "button", "aria-current": String(view.sid === sheet.sid), onclick: () => { view = { kind: "sheet", sid: sheet.sid }; editing = null; render(); } }, sheetName(sheet)));
      if (tpl.kind === "set") strip.append(el("button", { type: "button", class: "plus", "aria-label": "Добавить лист", onclick: () => addSheet(tpl.id) }, "+"));
      above.append(switcher, strip);
      stage.append(el("div", { class: "window no-sidebar" }, shownSheetContent()));
      return;
    }
    if (d === "table") {
      if (mode === "structure") {
        if (view.kind === "sheet") view = { kind: "template", tpl: sheetById(view.sid)?.tpl ?? "pc" };
        stage.append(el("div", { class: "window" }, sidebarOfTemplates(), shownSheetContent()));
      } else {
        stage.append(el("div", { class: "window no-sidebar" }, renderTable()));
      }
      return;
    }
    // lefttree
    stage.append(el("div", { class: "window no-sidebar" }, shownSheetContent()));
  }

  function render() {
    renderChrome();
    renderStage();
    renderLeft();
    const title = document.getElementById("preview-title");
    const sheet = view.kind === "sheet" ? sheetById(view.sid) : null;
    title.textContent = design() === "table" && mode === "data" ? "Данные снимка" : "Превью · окно 600 × 600" + (sheet ? " · " + sheetName(sheet) : "");
  }

  for (const button of document.querySelectorAll("[data-set-mode]")) {
    button.addEventListener("click", () => { mode = button.dataset.setMode; editing = null; tableTpl = tplOf(selected).id; render(); });
  }
  document.addEventListener("keydown", (event) => {
    if (clickModel() !== "dbl" || editing || event.key !== "Enter") return;
    if (event.target.closest("input, select, button")) return;
    const cell = document.querySelector(".content .cell.selected");
    if (cell) { event.preventDefault(); cell.click(); }
  });

  function reset() {
    sheets = snapshotFor(root.dataset.state || "few");
    editing = null;
    mode = "structure";
    selected = "f-hp";
    showTemplateOrSheet("pc");
    if (design() === "lefttree") view = { kind: "template", tpl: "pc" };
    render();
  }
  document.addEventListener("grill:change", reset);
  reset();
})();
</script>
</body>
</html>
