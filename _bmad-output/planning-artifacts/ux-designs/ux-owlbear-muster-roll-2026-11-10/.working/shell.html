<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muster Roll: оболочка</title><style>
/* Shell proposal. The sheet content is a sample of what a preset could produce. Colours are a neutral placeholder. */
:root{--bg:#1e1e1e;--panel:#333;--bar:#2a2a2a;--tab:#3a3a3a;--text:#ddd;--dim:#999;--accent:#d9b36c;--warn:#e0a13e;--bad:#e0604e;--line:#4a4a4a}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 8px}.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;align-items:center;color:var(--dim)}.ctl button{background:var(--tab);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer}.ctl button.on{border-color:var(--accent);color:var(--accent)}
.win{position:relative;width:720px;max-width:100%;height:600px;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 16px #000a}
.bar{display:flex;background:var(--bar);padding:8px 8px 0;gap:4px;flex:none}.scroll{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.t{flex:none;padding:7px 12px;border:0;border-radius:6px 6px 0 0;background:var(--tab);color:var(--text);cursor:pointer;font:inherit;white-space:nowrap}.t.on{background:var(--panel);color:var(--accent);font-weight:600}.t small{color:var(--dim);font-weight:400}.gear{padding:7px 10px}
.banner{flex:none;padding:6px 12px;font-size:13px;background:#4a3a1e;color:#ffd894}.banner.bad{background:#4f2b26;color:#ffb4a8}
.body{flex:1;overflow:auto;padding:12px}.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:16px}.chip{background:none;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}.chip.ro{cursor:default;color:var(--dim)}.more{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0 6px}
.drop{background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 10px;font-size:13px}.drop table{width:100%;border-collapse:collapse}.drop th,.drop td{text-align:left;padding:3px 6px}.drop th{color:var(--dim);font-weight:400}.drop p{margin:4px 0 0;color:var(--dim);font-size:12px}
.cols{display:flex;flex-wrap:wrap;gap:12px}.c{flex:1 1 190px;min-width:0;border-left:2px solid #6b5a3a;padding-left:8px}.c.full{flex-basis:100%}h4{margin:0 0 3px;font-size:14px;color:var(--accent)}.f{display:flex;justify-content:space-between;gap:8px;padding:2px 6px}.f:nth-of-type(even){background:#2d2d2d}.v{min-width:32px;text-align:right;outline:0}.v.edit{cursor:text;border-bottom:1px dotted #777}.v.pending{color:var(--warn)}.v.pending::after{content:" ждёт";font-size:11px}
.dice{margin-top:6px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.npc{border-left:2px solid #6b5a3a;padding:0 0 8px 8px;margin-bottom:12px}.npc h3{margin:0 0 3px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--accent)}.npc .more{font-size:16px}
.primary{background:var(--accent);border:0;color:#222;border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}.sec{background:none;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.set h3{margin:0;font-size:14px;color:var(--accent)}.set p{margin:2px 0 0;color:var(--dim);font-size:13px}.meter{height:6px;background:#222;border-radius:3px;margin:6px 0;max-width:280px}.meter i{display:block;height:100%;width:56%;background:var(--accent);border-radius:3px}
.empty{text-align:center;padding:90px 12px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#555;color:#fff;padding:8px 14px;border-radius:6px;display:none;max-width:90vw}
.note{max-width:720px;color:var(--dim);font-size:13px;margin-top:14px}.tok{display:inline-block;background:#fff;color:#222;border-radius:6px;padding:4px 10px;margin:2px 6px 2px 0;font-size:12px}
</style></head><body>
<h1>Оболочка Muster Roll</h1>
<div class="ctl"><span>Смотреть как:</span><button data-role="GM">ГМ</button><button data-role="PLAYER">Игрок (Брок)</button><span>Состояние:</span><button data-st="ok">Норма</button><button data-st="nogm">Нет связи с ГМ</button><button data-st="nofit">Снимок не влез</button><button data-st="nopreset">Нет пресета</button></div>
<div class="win" id="win"></div>
<p class="note"><b>На токене в Owlbear</b> (правый клик), отдельно от окна:<br><span class="tok">Открыть лист</span> у привязанного токена, открывает это окно на нужной вкладке.<br><span class="tok">Привязать лист…</span> только у ГМа, короткий список листов без токена.</p>
<div id="toast"></div>
<script>
const S={role:'GM',st:'ok',tab:'c0',access:false,menu:'',npcs:['Староста','Скелет 1','Скелет 2','Скелет 3'],chars:['Эльверанха','Брок','Тиша','Гром','Лира','Мика','Ровена','Зигфрид','Хельга','Торвальд','Ингрид'],pending:false};
const W=document.getElementById('win'),T=document.getElementById('toast');
const toast=m=>{T.textContent=m;T.style.display='block';clearTimeout(T._);T._=setTimeout(()=>T.style.display='none',2500)};
function order(){const a=S.chars.map((n,i)=>({n,i}));if(S.role==='PLAYER'){const k=a.findIndex(x=>x.n==='Брок');a.unshift(a.splice(k,1)[0])}return a}
function sheet(name,edit){const e=edit?'edit" contenteditable="true':'';const f=(l,v)=>`<div class="f"><span>${l}</span><span class="v ${e}" data-f>${v}</span></div>`;
return `<div class="cols"><div class="c"><h4>Основное</h4>${f('Имя',name)}${f('Уровень',3)}${f('Хиты','8 / 8')}${f('Защита',9)}</div><div class="c"><h4>Атрибуты</h4>${f('Сила',12)}${f('Ловкость',10)}${f('Харизма',14)}<button class="dice" data-roll="${name}: 1d20 ≤ 12 → 7, успех">Бросок силы</button></div><div class="c full"><h4>Инвентарь</h4>${f('Посох',1)}${f('Свиток огня',2)}${edit?'<button class="dice" style="border-color:var(--line);color:var(--dim)">+ строка</button>':''}</div></div>`}
function view(){if(S.st==='nopreset')return S.role==='GM'?`<div class="empty">Пресета ещё нет. Загрузите файл, и появятся листы.<div class="row" style="justify-content:center"><button class="primary">Загрузить пресет</button></div></div>`:`<div class="empty">ГМ ещё не настроил листы.</div>`;
if(S.tab==='set')return `<div class="set"><h3>Пресет</h3><p>Dark Fantasy Basic, 41 поле.</p><div class="row"><button class="primary">Загрузить пресет</button><button class="sec">Скачать пресет</button></div><h3>Комната</h3><p>Все листы и привязки токенов одним файлом.</p><div class="row"><button class="primary">Загрузить снимок</button><button class="sec">Скачать снимок</button></div><h3>Копия в комнате</h3><p>${S.st==='nofit'?'Не влезла. Если вы смените браузер, данных там не будет. Скачайте снимок.':'Сохранено. Занято 8,7 из 15,5 кБ.'}</p><div class="meter"><i style="${S.st==='nofit'?'width:100%;background:var(--bad)':''}"></i></div></div>`;
if(S.tab==='npc'){return `<div class="head"><h2>NPC</h2><button class="sec" id="addnpc" style="margin-left:auto">+ NPC</button></div>`+S.npcs.map((n,i)=>`<div class="npc"><h3>${n}<button class="chip">${i<2?'токен есть':'нет токена'}</button><button class="more" data-menu="n${i}">⋯</button></h3>${S.menu==='n'+i?`<div class="drop"><button class="sec" data-copy="${n}">Сделать копии…</button> <button class="sec" data-del="${i}">Удалить</button></div>`:''}<div class="f"><span>Хиты</span><span class="v edit" contenteditable="true">7 / 7</span></div><div class="f"><span>Защита</span><span class="v edit" contenteditable="true">7</span></div><button class="dice" data-roll="${n}: 1d20+2 → 15 (видит только ГМ)">Атака</button></div>`).join('')}
const i=+S.tab.slice(1),name=S.chars[i],gm=S.role==='GM',own=name==='Брок',edit=gm||own;
let head=`<div class="head"><h2>${name}</h2>`;
if(gm)head+=`<button class="chip" id="access">Доступ: ${name==='Брок'?'Брок правит':'никто'}</button><button class="chip">токен есть</button><button class="more" data-menu="s">⋯</button>`;else head+=`<span class="chip ro">${own?'ваш лист':'только чтение'}</span>`;
head+='</div>';
if(gm&&S.access)head+=`<div class="drop"><table><tr><th>Игрок</th><th>Его персонаж</th><th>Может править</th></tr><tr><td>Брок (сейчас в комнате)</td><td><input type="radio" name="o" checked></td><td><input type="checkbox" checked></td></tr><tr><td>Death Dog (сейчас в комнате)</td><td><input type="radio" name="o"></td><td><input type="checkbox"></td></tr></table><p>Гость привязан к своему браузеру. Если он зайдёт из другого, доступ придётся выдать снова.</p></div>`;
if(gm&&S.menu==='s')head+=`<div class="drop"><button class="sec">Удалить персонажа</button></div>`;
return head+sheet(name,edit)}
function render(){const gm=S.role==='GM';if(!gm&&(S.tab==='npc'||S.tab==='set'))S.tab='c'+S.chars.indexOf('Брок');
let tabs=S.st==='nopreset'?'':order().map(x=>`<button class="t ${S.tab==='c'+x.i?'on':''}" data-tab="c${x.i}">${x.n}${!gm&&x.n==='Брок'?' <small>вы</small>':''}</button>`).join('')+(gm?'<button class="t" id="addc" title="Новый персонаж">+</button>':'');
let right=gm?`${S.st==='nopreset'?'':`<button class="t ${S.tab==='npc'?'on':''}" data-tab="npc">NPC</button>`}<button class="t gear ${S.tab==='set'?'on':''}" data-tab="set" title="Настройки">⚙</button>`:'';
let banner='';if(!gm&&S.st==='nogm')banner='<div class="banner">Нет связи с ГМ. Правки отправятся, когда он вернётся.</div>';if(gm&&S.st==='nofit')banner='<div class="banner bad">Копия не влезла в комнату. Игра идёт дальше, но скачайте снимок.</div>';
W.innerHTML=`<div class="bar"><div class="scroll">${tabs}</div>${right}</div>${banner}<div class="body">${view()}</div>`;
document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));document.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('on',b.dataset.st===S.st))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.role){S.role=d.role;S.access=false;S.menu='';S.tab='c0'}else if(d.st){S.st=d.st;if(d.st==='nofit')S.role='GM';if(d.st==='nogm')S.role='PLAYER'}else if(d.tab){S.tab=d.tab;S.access=false;S.menu=''}else if(b.id==='access')S.access=!S.access;else if(d.menu)S.menu=S.menu===d.menu?'':d.menu;else if(d.roll){toast(d.roll);return}else if(b.id==='addc'){S.chars.push('Новый');S.tab='c'+(S.chars.length-1)}else if(b.id==='addnpc')S.npcs.unshift('Новый NPC');else if(d.copy){const n=+prompt('Сколько копий?','9')||0;const base=d.copy.replace(/ \d+$/,'');for(let k=0;k<n;k++)S.npcs.push(`${base} ${S.npcs.filter(x=>x.startsWith(base)).length+1}`);S.menu=''}else if(d.del){S.npcs.splice(+d.del,1);S.menu=''}else return;render()});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('.v.edit')&&S.st==='nogm'&&S.role==='PLAYER')e.target.classList.add('pending')});
render();
</script></body></html>
