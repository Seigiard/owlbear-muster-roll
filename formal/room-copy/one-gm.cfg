\* Gate, safety: one GM client that closes and reopens its page. A room has one
\* GM, so this is the case the owner holds the room copy to: an edit the open
\* page holds is in the room copy or owed (TASK-118).
CONSTANTS
  GMs = {A}
  Editors = {A}
  MaxEdits = 1
  Break = "none"
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  NoFalseSaved
  StopEndsWork
  RoomKeepsEdits
  NoSilentLossAtRest
  NoLossForGood
