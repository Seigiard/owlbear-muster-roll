\* Safety of the code as it is, with a promotion. GM a and player b; one
\* snapshot import or wipe, one role change (b's promotion or a's demotion),
\* one page close, one failed generation save and one failed import room-copy
\* write, each at any moment. A promoted b can hold a `state` of the old
\* generation while it adopts the new one, which reaches the retry of a failed
\* adoption save. Expected: no error.
CONSTANTS
  a = a
  b = b
  Clients = {a, b}
  PlayersAtStart = {b}
  MaxImports = 1
  MaxRoleChanges = 1
  MaxCloses = 1
  MaxStoreFails = 1
  MaxCopyFails = 1
  Bug = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ReplicaOneGeneration
  StagedIsTarget
  CopyOneGeneration
  NotBehindUnlessAdopting
  PersistIsOwn
  NoStoreRegress
  WorkingGenerationSaved
