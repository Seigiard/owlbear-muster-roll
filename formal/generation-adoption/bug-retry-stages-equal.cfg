\* Broken variant: when a failed adoption save is retried on a `state` of the
\* client's own generation, that state's records are staged too. Expected: a
\* mixing rule fails; TLC reports ReplicaOneGeneration or StagedIsTarget. Player
\* b starts so that its promotion can reach the retry, as in Promoted.cfg.
CONSTANTS
  a = a
  b = b
  Clients = {a, b}
  PlayersAtStart = {b}
  MaxImports = 1
  MaxRoleChanges = 1
  MaxCloses = 0
  MaxStoreFails = 1
  MaxCopyFails = 0
  Bug = "retry-stages-equal"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  ReplicaOneGeneration
  StagedIsTarget
  CopyOneGeneration
  NotBehindUnlessAdopting
  PersistIsOwn
  NoStoreRegress
  WorkingGenerationSaved
