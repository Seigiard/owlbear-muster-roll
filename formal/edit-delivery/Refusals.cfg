\* Refusals: a revoke of write access, an edit too large for one message, a catch-up.
\* The GM stays live. One loss lets a `denied` reject reach the player before the
\* revoke does; with none, the revoke's commit always comes first (one FIFO queue).
\* NoDoubleApply is checked in DoubleApply.cfg: with a loss it fails here too (F1).
SPECIFICATION Spec
CONSTANTS
  PlayerValues = {0, 1}
  GmValues = {1}
  MaxEdits = 2
  MaxGmEdits = 1
  MaxGmFlips = 0
  MaxRevokes = 1
  MaxCatchUps = 1
  MaxLosses = 1
  AllowTooLarge = TRUE
  Mutation = "none"
INVARIANTS
  TypeOK
  NoSilentLoss
  OwnOrderKept
  OneVersionOneEdit
  NeverStranded
