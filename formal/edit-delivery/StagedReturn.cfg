\* Two fields and two edits: with one bounded GM interruption and one loss,
\* fairness must resolve the staged entry after the GM returns and stays live.
SPECIFICATION FairSpec
CONSTANTS
  Fields = {"str", "note"}
  PlayerValues = {1}
  GmValues = {2}
  MaxEdits = 2
  MaxGmEdits = 0
  MaxGmFlips = 2
  MaxRevokes = 0
  MaxCatchUps = 0
  MaxLosses = 1
  AllowTooLarge = FALSE
  Mutation = "none"
  GmFlips <- GmReload
PROPERTY
  EntryResolves
INVARIANTS
  NoSilentLoss
  NoDoubleApply
  NeverStranded
