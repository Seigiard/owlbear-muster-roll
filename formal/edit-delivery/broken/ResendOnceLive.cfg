\* Broken variant: the resend timer fires once and does not re-arm. Must stop TLC: a
\* lost `propose` then waits forever with the GM back. TLC reports it as a deadlock (no
\* step is left while the entry waits) or as a broken EntryResolves.
SPECIFICATION FairSpec
CONSTANTS
  PlayerValues = {0, 1}
  GmValues = {1}
  MaxEdits = 1
  MaxGmEdits = 1
  MaxGmFlips = 2
  MaxRevokes = 0
  MaxCatchUps = 0
  MaxLosses = 1
  AllowTooLarge = FALSE
  Mutation = "resend-once"
PROPERTY
  EntryResolves
