\* Broken variant: the GM forgets the proposals it committed (room-protocol.ts
\* committedEdits), as before TASK-119, so a resend after a lost commit reads as stale and
\* its rebuilt patch overwrites a later GM edit (finding F1). Must break NoDoubleApply.
SPECIFICATION Spec
CONSTANTS
  PlayerValues = {0, 1}
  GmValues = {1}
  MaxEdits = 2
  MaxGmEdits = 1
  MaxGmFlips = 2
  MaxRevokes = 0
  MaxCatchUps = 1
  MaxLosses = 1
  AllowTooLarge = FALSE
  Mutation = "forgets-committed"
INVARIANTS
  NoDoubleApply
