\* Known current-code limit, not a deliberately mutated normal config: one lost
\* ACK, same-field GM correction, then reload before resend clears committed history.
SPECIFICATION Spec
CONSTANTS
  Fields = {"str", "note"}
  PlayerValues = {1}
  GmValues = {2}
  MaxEdits = 2
  MaxGmEdits = 1
  MaxGmFlips = 2
  MaxRevokes = 0
  MaxCatchUps = 0
  MaxLosses = 1
  AllowTooLarge = FALSE
  Mutation = "none"
  GmFlips <- GmReload
INVARIANT
  NoOldCellReplayAfterLostAck
