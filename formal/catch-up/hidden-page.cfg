\* Both pages' timers can stop for a while and run again (a frozen tab, a
\* sleeping laptop), and the player's page returns once. A late gm-silence
\* pings and waits again (TASK-120), so no client marks an answering GM
\* offline. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 2
    MaxOpens = 1
    MaxReturns = 1
    MaxRoleChanges = 0
    HideClients = {"p", "g"}
    MaxInFlight = 2
    Imports = 0
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOffline
    AnswerKept
    OwnAnswerKeepsRequest
CHECK_DEADLOCK FALSE
