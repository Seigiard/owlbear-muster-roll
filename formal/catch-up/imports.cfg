\* then a higher one, also while it adopts. Every invariant here holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p"}
    GmClients = {}
    Unreadable = {}
    MaxIds = 4
    MaxOpens = 1
    MaxReturns = 1
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    Imports = 2
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    OwnAnswerKeepsRequest
CHECK_DEADLOCK FALSE
