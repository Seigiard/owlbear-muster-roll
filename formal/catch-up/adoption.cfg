    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 2
    MaxOpens = 1
    MaxReturns = 0
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    Imports = 1
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
    OwnAnswerKeepsRequest
CHECK_DEADLOCK FALSE
