\* A role changes while the room runs: the GM becomes a player or the player
\* becomes a GM, and the client catches up again. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 3
    MaxOpens = 1
    MaxReturns = 0
    MaxRoleChanges = 1
    HideClients = {}
    MaxInFlight = 2
    WithImport = FALSE
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
CHECK_DEADLOCK FALSE
