\* Scratch break: gm-silence checks only that it fired on time, not that its
\* last ping is old, so a page that woke just before the silence came due
\* takes the link offline before the GM's reply to the wake's ping.
\* Expected: NoPrematureOfflineVisible is violated.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 2
    MaxOpens = 1
    MaxReturns = 1
    MaxRoleChanges = 0
    HideClients = {"p"}
    MaxInFlight = 2
    Imports = 0
    SaveCanFail = FALSE
    Mutation = "silence-ignores-ping-age"
CONSTRAINT Bounds
INVARIANT NoPrematureOfflineVisible
CHECK_DEADLOCK FALSE
