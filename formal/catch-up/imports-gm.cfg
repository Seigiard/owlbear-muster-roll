\* The importer "x" imports twice with the GM "g" in the room: g can adopt one
\* generation and then a higher one, also while it adopts. To fit, no page
\* return, 3 catch-up ids, and no ping or alive on its way (NoPingTraffic).
\* Every invariant here holds; OwnAnswerKeepsRequest does not (finding 5,
\* for g too), and fixes/own-answer-kept-gm.cfg checks it with the fix.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 3
    MaxOpens = 1
    MaxReturns = 0
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    Imports = 2
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
CONSTRAINT NoPingTraffic
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
CHECK_DEADLOCK FALSE
