\* The GM "g" adopts the importer's generation and its saveAdoption can fail,
\* any number of times: the adoption stays pending and saves again on the next
\* `state` or room copy. The room of adoption.cfg, with no ping or alive on
\* its way (NoPingTraffic). Every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 2
    MaxOpens = 1
    MaxReturns = 0
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    Imports = 1
    SaveCanFail = TRUE
    Mutation = "none"
CONSTRAINT Bounds
CONSTRAINT NoPingTraffic
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
    OwnAnswerKeepsRequest
CHECK_DEADLOCK FALSE
