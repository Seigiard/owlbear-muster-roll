\* The fix TASK-129 asks for, in the room of imports-gm.cfg: the GM "g" and
\* the player "p" each can adopt twice, and every `state` that answers an
\* adopting client's own `r` keeps that `r`. No ping or alive on its way
\* (NoPingTraffic). Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 3
    MaxOpens = 1
    MaxReturns = 0
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    Imports = 2
    SaveCanFail = FALSE
    Mutation = "fix-answers-own"
CONSTRAINT Bounds
CONSTRAINT NoPingTraffic
INVARIANTS
    OwnAnswerKeepsRequest
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
CHECK_DEADLOCK FALSE
