\* Main check: a player "p" and a GM "g" open the room, catch up, return to
\* the page, close; pings and gm-silence run throughout. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Clients = {"p", "g"}
    GmClients = {"g"}
    Unreadable = {}
    MaxIds = 3
    MaxOpens = 1
    MaxReturns = 1
    MaxRoleChanges = 0
    HideClients = {}
    MaxInFlight = 2
    WithImport = FALSE
    SaveCanFail = FALSE
    Mutation = "none"
CONSTRAINT Bounds
INVARIANTS
    TimeoutArmed
    SilenceArmed
    PingArmed
    NoPrematureOfflineVisible
    AnswerKept
CHECK_DEADLOCK FALSE
